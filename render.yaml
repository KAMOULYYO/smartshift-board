services:
  - type: web
    name: smartshift-board
    runtime: python
    region: oregon
    rootDir: backend
    buildCommand: pip install --upgrade pip setuptools wheel && pip install --only-binary pydantic-core -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: FRONTEND_URL
        value: "*"
